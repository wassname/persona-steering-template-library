[project]
name = "persona-steering-template-library"
version = "0.1.0"
description = "Measured persona prompt templates and contrastive persona pairs for steering experiments."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
dependencies = [
  "adjusttext>=1.3.0",
  "huggingface-hub>=0.36,<1",
  "inspect-ai>=0.3.246",
  "loguru",
  "matplotlib>=3.10.0",
  "openai>=2.45.0",
  "pyarrow>=24.0.0",
  "pyyaml",
  "python-dotenv",
  "tabulate",
  "tqdm",
  "plotly>=6.0.0",
  "kaleido>=1.3.0",
  "polars>=1.41.2",
  "datasets>=5.0.0",
]

[tool.uv]
package = false

[dependency-groups]
dev = ["pytest>=8.4.2"]

[tool.ruff]
line-length = 100
