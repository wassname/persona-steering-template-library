[project]
name = "persona-steering-template-library"
version = "0.1.0"
description = "Measured persona prompt templates and contrastive persona pairs for steering experiments."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
dependencies = [
  "adjusttext>=1.3.0",
  "huggingface-hub>=1.18.0",
  "loguru",
  "matplotlib>=3.10.0",
  "openai",
  "pyarrow>=24.0.0",
  "pyyaml",
  "python-dotenv",
  "tabulate",
  "tqdm",
  "plotly>=6.0.0",
  "kaleido>=1.3.0",
  "polars>=1.41.2",
  "datasets>=5.0.0",
  "openrouter-wrapper",
]

[tool.uv]
package = false

[tool.uv.sources]
openrouter-wrapper = { git = "https://github.com/wassname/openrouter_wrapper" }

[tool.ruff]
line-length = 100
